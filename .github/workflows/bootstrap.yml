name: Bootstrap verified Lean snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.repository == 'wangyangvictor/cubic-lean-mid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify and unpack the prepared source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import os
          import re
          import tarfile

          expected_hash = '86324241750232ec13286e190bcbfa32abf62f8a8d2039b54c1079ebe77e9df2'
          expected_count = int('2179')
          assert re.fullmatch(r'[0-9a-f]{64}', expected_hash)
          assert expected_count > 0
          archive = Path('cubic-lean-mid-bootstrap.tar.gz')
          assert archive.is_file() and not archive.is_symlink()
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected_hash
          source = Path(os.environ['RUNNER_TEMP']) / 'cubic-lean-source'
          source.mkdir()
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              files = []
              seen = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert '\\' not in member.name and '\x00' not in member.name
                  assert all(ord(c) >= 32 and ord(c) != 127 for c in member.name)
                  assert member.isdir() or member.isfile(), member.name
                  assert not member.issym() and not member.islnk(), member.name
                  assert member.mode & 0o7000 == 0, member.name
                  normalized = path.as_posix()
                  assert normalized not in seen, member.name
                  seen.add(normalized)
                  assert '.git' not in path.parts, member.name
                  assert not path.parts or path.parts[0] != archive.name, member.name
                  if member.isfile():
                      assert normalized != '.', member.name
                      files.append(member)
              assert len(files) == expected_count, (len(files), expected_count)
              file_paths = {PurePosixPath(m.name) for m in files}
              assert all(parent not in file_paths for p in file_paths for parent in p.parents)
              # The archive contains repository-root paths, optionally prefixed by ./.
              assert PurePosixPath('README.md') in file_paths
              assert PurePosixPath('scripts/check.sh') in file_paths
              assert PurePosixPath('formalization/CubicTenVariables/lean-toolchain') in file_paths
              # Only validated regular files/directories enter this fresh empty directory.
              tar.extractall(source, members=members)
          assert sum(p.is_file() for p in source.rglob('*')) == expected_count
          assert not any(p.is_symlink() for p in source.rglob('*'))
          assert os.access(source / 'scripts/check.sh', os.X_OK)
          print(f'Verified {expected_count} source files, SHA256 {expected_hash}')
          PY
          source_dir="$RUNNER_TEMP/cubic-lean-source"
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' "$source_dir"/ ./
          test ! -e cubic-lean-mid-bootstrap.tar.gz
      - name: Commit the source tree and remove the uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git commit -m 'Publish checked cubic forms formalization snapshot'
          git push origin HEAD:main
